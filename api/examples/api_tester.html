<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebDokter API Tester</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 30px;
        }

        .section {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            background: #f9f9f9;
        }

        .section h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.3em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .button-group {
            display: grid;
            gap: 10px;
        }

        button {
            padding: 12px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        button:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        button:active {
            transform: translateY(0);
        }

        button.secondary {
            background: #6c757d;
        }

        button.secondary:hover {
            background: #5a6268;
        }

        .output {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 5px;
            padding: 15px;
            margin-top: 20px;
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 0.9em;
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #667eea;
            font-style: italic;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
            border-left: 4px solid #c33;
        }

        .success {
            background: #efe;
            color: #3c3;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
            border-left: 4px solid #3c3;
        }

        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏥 WebDokter API Tester</h1>
            <p>Uji semua endpoint API untuk integrasi mobile</p>
        </header>

        <div class="content">
            <!-- Section 1: Organ -->
            <div class="section">
                <h2>📋 Kategori Organ</h2>
                <div class="button-group">
                    <button onclick="testOrgans()">Get All Organs</button>
                </div>
                <div id="organOutput" class="output"></div>
            </div>

            <!-- Section 2: Disease -->
            <div class="section">
                <h2>🦠 Penyakit</h2>
                <div class="button-group">
                    <button onclick="testDiseases()">Get All Diseases</button>
                    <button onclick="testDiseasesByOrgan()">Get Diseases by Organ (ID: 1)</button>
                    <button onclick="testDiseaseDetail()">Get Disease Detail (ID: 1)</button>
                </div>
                <div id="diseaseOutput" class="output"></div>
            </div>

            <!-- Section 3: Doctor -->
            <div class="section">
                <h2>👨‍⚕️ Profil Dokter</h2>
                <div class="button-group">
                    <button onclick="testDoctor()">Get Doctor Profile</button>
                </div>
                <div id="doctorOutput" class="output"></div>
            </div>

            <!-- Section 4: Schedule -->
            <div class="section">
                <h2>📅 Jadwal Praktik</h2>
                <div class="button-group">
                    <button onclick="testSchedules()">Get All Schedules</button>
                    <button onclick="testScheduleDetail()">Get Schedule Detail (ID: 1)</button>
                </div>
                <div id="scheduleOutput" class="output"></div>
            </div>

            <!-- Section 5: Services -->
            <div class="section">
                <h2>💊 Layanan Medis</h2>
                <div class="button-group">
                    <button onclick="testServices()">Get All Services</button>
                </div>
                <div id="serviceOutput" class="output"></div>
            </div>

            <!-- Section 6: API Info -->
            <div class="section">
                <h2>ℹ️ API Information</h2>
                <div class="button-group">
                    <button onclick="testAPIInfo()" class="secondary">Get API Info</button>
                    <button onclick="clearAllOutputs()" class="secondary">Clear All</button>
                </div>
                <div id="infoOutput" class="output"></div>
            </div>
        </div>
    </div>

    <script src="vanilla_js_client.js"></script>
    <script>
        const API = new WebDokterAPI('http://localhost/WebDokter/api');

        function showLoading(elementId) {
            document.getElementById(elementId).innerHTML = '<div class="loading"><div class="spinner"></div> Loading...</div>';
        }

        function displayOutput(elementId, data, isError = false) {
            const output = document.getElementById(elementId);
            const className = isError ? 'error' : 'success';
            output.innerHTML = `<div class="${className}">${JSON.stringify(data, null, 2)}</div>`;
        }

        async function testOrgans() {
            showLoading('organOutput');
            try {
                const data = await API.getOrgans();
                displayOutput('organOutput', data);
            } catch (error) {
                displayOutput('organOutput', { error: error.message }, true);
            }
        }

        async function testDiseases() {
            showLoading('diseaseOutput');
            try {
                const data = await API.getDiseases();
                displayOutput('diseaseOutput', data);
            } catch (error) {
                displayOutput('diseaseOutput', { error: error.message }, true);
            }
        }

        async function testDiseasesByOrgan() {
            showLoading('diseaseOutput');
            try {
                const data = await API.getDiseasesByOrgan(1);
                displayOutput('diseaseOutput', data);
            } catch (error) {
                displayOutput('diseaseOutput', { error: error.message }, true);
            }
        }

        async function testDiseaseDetail() {
            showLoading('diseaseOutput');
            try {
                const data = await API.getDiseaseDetail(1);
                displayOutput('diseaseOutput', data);
            } catch (error) {
                displayOutput('diseaseOutput', { error: error.message }, true);
            }
        }

        async function testDoctor() {
            showLoading('doctorOutput');
            try {
                const data = await API.getDoctorProfile();
                displayOutput('doctorOutput', data);
            } catch (error) {
                displayOutput('doctorOutput', { error: error.message }, true);
            }
        }

        async function testSchedules() {
            showLoading('scheduleOutput');
            try {
                const data = await API.getSchedules();
                displayOutput('scheduleOutput', data);
            } catch (error) {
                displayOutput('scheduleOutput', { error: error.message }, true);
            }
        }

        async function testScheduleDetail() {
            showLoading('scheduleOutput');
            try {
                const data = await API.getScheduleDetail(1);
                displayOutput('scheduleOutput', data);
            } catch (error) {
                displayOutput('scheduleOutput', { error: error.message }, true);
            }
        }

        async function testServices() {
            showLoading('serviceOutput');
            try {
                const data = await API.getServices();
                displayOutput('serviceOutput', data);
            } catch (error) {
                displayOutput('serviceOutput', { error: error.message }, true);
            }
        }

        async function testAPIInfo() {
            showLoading('infoOutput');
            try {
                const response = await fetch('http://localhost/WebDokter/api');
                const data = await response.json();
                displayOutput('infoOutput', data);
            } catch (error) {
                displayOutput('infoOutput', { error: error.message }, true);
            }
        }

        function clearAllOutputs() {
            document.querySelectorAll('.output').forEach(el => el.innerHTML = '');
        }

        // Auto-load API info on page load
        window.addEventListener('load', testAPIInfo);
    </script>
</body>
</html>
